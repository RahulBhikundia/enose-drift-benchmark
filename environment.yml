# Conda environment for the project. Exact versions used for every reported number: requirements.lock.txt
#   conda env create -f environment.yml && conda activate enose-drift
name: enose-drift
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - numpy==2.1.3
      - scipy==1.14.1
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - matplotlib==3.9.4
      - pyarrow==26.0.1
      - huggingface_hub==2.4.0
      - tqdm==4.70.1
      - PyYAML==6.0.3
      - pillow==13.0.0
      - pytest           # only for tests/
